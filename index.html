<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindmapper | Antigravity Board</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Hidden File Input Fields for trigger actions -->
  <input type="file" id="json-file-input" accept=".json" style="display: none;">
  <input type="file" id="markdown-file-input" accept=".md,.txt" style="display: none;">

  <div class="app-container">

    <!-- Top Navigation & Control Toolbar -->
    <header class="toolbar" id="toolbar">
      <div class="toolbar-group">
        <!-- Sidebar Toggle -->
        <button type="button" class="btn-tool" id="btn-toggle-sidebar" title="Toggle left sidebar">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          <span>Sidebar</span>
        </button>
        <div class="toolbar-divider"></div>

        <!-- Node manipulations -->
        <button type="button" class="btn-tool" id="btn-add-child" title="Add a new child node to the selected node">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          <span>Add Child</span>
        </button>
        <button type="button" class="btn-tool" id="btn-add-sibling" title="Add a new sibling beside the selected node">
          <svg viewBox="0 0 24 24"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
          <span>Add Sibling</span>
        </button>
        <button type="button" class="btn-tool btn-destructive" id="btn-delete" title="Delete the selected node and its child branches">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          <span>Delete</span>
        </button>
      </div>

      <div class="toolbar-group">
        <!-- Canvas Operations -->
        <button type="button" class="btn-tool" id="btn-zoom-out" title="Zoom out of the canvas">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button type="button" class="btn-tool" id="btn-zoom-reset" title="Reset zoom to 100%">
          <span class="zoom-indicator" id="zoom-text">100%</span>
        </button>
        <button type="button" class="btn-tool" id="btn-zoom-in" title="Zoom in on the canvas">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        
        <div class="toolbar-divider"></div>
        <button type="button" class="btn-tool" id="btn-tidy-layout" title="Reflow the nodes into a clean tree layout">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span>Tidy Layout</span>
        </button>
      </div>

      <div class="toolbar-group">
        <!-- File Actions -->
        <button type="button" class="btn-tool" id="btn-new-json" title="Create a new mind map">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          <span>New</span>
        </button>
        <button type="button" class="btn-tool" id="btn-load-json" title="Load a saved JSON mind map">
          <svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></svg>
          <span>Load</span>
        </button>
        <button type="button" class="btn-tool" id="btn-save-json" title="Save current mind map JSON">
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <span>Save</span>
        </button>
        <button type="button" class="btn-tool" id="btn-save-as-json" title="Save current mind map as a new JSON file">
          <svg viewBox="0 0 24 24"><path d="M17 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2z"/><path d="M19 16H10"/><path d="M13 13l-3 3 3 3"/></svg>
          <span>Save As</span>
        </button>
        
        <div class="toolbar-divider"></div>
        <button type="button" class="btn-tool" id="btn-import-md" title="Import from a nested Markdown outline">
          <svg viewBox="0 0 24 24"><path d="M12 17V3M6 11l6 6 6-6M19 21H5"/></svg>
          <span>Import Markdown</span>
        </button>
        <button type="button" class="btn-tool" id="btn-export-md" title="Export current mind map to Markdown">
          <svg viewBox="0 0 24 24"><path d="M12 3v14M6 9l6-6 6 6M19 21H5"/></svg>
          <span>Export Markdown</span>
        </button>

        <div class="toolbar-divider"></div>
        <!-- Inspector Toggle -->
        <button type="button" class="btn-tool" id="btn-toggle-inspector" title="Toggle right inspector">
          <span>Inspector</span>
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        </button>
      </div>
    </header>

    <!-- Split Panels Container -->
    <main class="main-workspace">

      <!-- Left Sidebar panel -->
      <aside class="panel-sidebar" id="panel-sidebar">
        <div class="panel-title">
          <span>Document Explorer</span>
        </div>
        
        <!-- Document Renamer Section -->
        <div class="doc-section">
          <label class="inspector-label" for="input-doc-title">Document Title</label>
          <input type="text" id="input-doc-title" class="input-doc-title" placeholder="Mind map title">
          <div class="file-indicator">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span id="label-file-displayName">Unsaved mind map</span>
          </div>
        </div>

        <div class="panel-title" style="border-top: 1px solid var(--border-ui); border-bottom: none;">
          <span>Node Outline</span>
        </div>

        <!-- Node List Outline Section -->
        <div class="nodes-list-container" id="nodes-list-container">
          <!-- Populated by JS -->
        </div>

        <!-- Left Sidebar Footer Status Bar -->
        <footer class="status-bar">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span class="status-text" id="status-text">Ready</span>
        </footer>
      </aside>

      <!-- Middle Infinite Interactive Canvas -->
      <section class="canvas-viewport" id="canvas-viewport">
        
        <!-- Grid Blueprint canvas contents -->
        <div class="canvas-content" id="canvas-content">
          
          <!-- SVG Connections Layer -->
          <svg class="svg-connections-layer" id="svg-connections-layer">
            <g id="connections-group"></g>
            <g id="preview-group"></g>
          </svg>

          <!-- Absolutely Positioned Dynamic HTML Nodes -->
          <div class="nodes-layer" id="nodes-layer">
            <!-- Populated dynamically by JS -->
          </div>
        </div>

        <!-- Canvas Floating HUD Overlay -->
        <div class="canvas-hud">
          <div class="canvas-hud-group" title="Total Nodes">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><line x1="12" y1="8" x2="19" y2="16"/><line x1="12" y1="8" x2="5" y2="16"/></svg>
            <span id="hud-node-count">1</span>
          </div>
          <div class="canvas-hud-divider"></div>
          <div class="canvas-hud-group" title="Total Edges">
            <svg viewBox="0 0 24 24"><line x1="4" y1="4" x2="20" y2="20"/><circle cx="4" cy="4" r="3"/><circle cx="20" cy="20" r="3"/></svg>
            <span id="hud-edge-count">0</span>
          </div>
          <div class="canvas-hud-divider"></div>
          
          <button type="button" id="hud-zoom-out" title="Zoom Out">
            <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <span id="hud-zoom-percent" style="font-family: monospace; min-width: 36px; text-align: center;">100%</span>
          <button type="button" id="hud-zoom-in" title="Zoom In">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>

        <!-- File Drag and Drop zone overlay -->
        <div class="drop-zone-overlay" id="drop-zone-overlay">
          <svg viewBox="0 0 24 24" width="48" height="48" stroke="#fbbf24" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          <div class="drop-zone-text">Drop JSON or Markdown Outline here</div>
        </div>
      </section>

      <!-- Right Sidebar Inspector panel -->
      <aside class="panel-inspector" id="panel-inspector">
        <div class="panel-title">
          <span>Inspector</span>
        </div>
        
        <!-- Inspector Editing Fields -->
        <div class="inspector-content" id="inspector-content">
          <!-- Populated by JS based on selected node state -->
        </div>
      </aside>

    </main>
  </div>

  <!-- Bootstrapping main app bundle -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
